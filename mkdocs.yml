site_name: UA-Hazır Türkiye 2027
site_description: Var olan projeleri Evrensel Kabul (Universal Acceptance) uyumlu hale getirme yarışması
site_url: !ENV [SITE_URL, 'https://furkan-brk.github.io/ua-hazir-turkiye/']
copyright: UA-Hazır Türkiye 2027 · Evrensel Kabul Uyum Çağrısı

theme:
  name: material
  custom_dir: overrides
  language: tr
  logo: assets/logo.svg
  favicon: assets/logo.svg

  # Media-driven palette yok: sistem tercihi + manuel toggle birlikte
  # sayfa yüklemesinde "flash" yaratıyor. İlk ziyaret açık tema, tercih kalıcı.
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Koyu temaya geç
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Açık temaya geç

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    # navigation.instant KULLANILMADI: mkdocs-static-i18n dil değiştirici
    # contextual link özelliği ile uyumsuz.

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/filter.js

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: tr
          default: true
          name: Türkçe
          build: true
        - locale: en
          name: English
          build: true
          site_name: UA-Ready Türkiye 2027
          nav_translations:
            Ana Sayfa: Home
            Nasıl İşler: How It Works
            Kontrol Listesi: Checklist
            Örnek Projeler: Example Projects
            SSS: FAQ
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Ana Sayfa: index.md
  - Nasıl İşler: program.md
  - Kontrol Listesi: kriterler.md
  - Örnek Projeler: ornek-projeler/index.md
  - SSS: sss.md
