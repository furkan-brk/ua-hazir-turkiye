site_name: UA-Hazır Türkiye 2027
site_description: Var olan projeleri Evrensel Kabul (Universal Acceptance) uyumlu hale getirme yarışması
site_url: https://example.github.io/ua-hazir-turkiye/
repo_url: https://github.com/example/ua-hazir-turkiye
copyright: UA-Hazır Türkiye 2027 · Evrensel Kabul Uyum Çağrısı

theme:
  name: material
  language: tr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Koyu temaya geç
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Açık temaya geç
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
  icon:
    logo: material/at

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: tr
          default: true
          name: Türkçe
          build: true
        - locale: en
          name: English
          build: true
          site_name: UA-Ready Türkiye 2027
          nav_translations:
            Ana Sayfa: Home
            Program: Program
            Evrensel Kabul: Universal Acceptance
            Takvim: Schedule
            Katılım: Participation
            Kriterler: Criteria
            Doğrulama: Verification
            Değerlendirme: Judging
            Örnek Projeler: Example Projects
            Kaynaklar: Resources
            SSS: FAQ
            Web ve E-ticaret: Web and E-commerce
            Kamu ve Eğitim: Public Sector and Education
            Mobil: Mobile
            E-posta Altyapısı: Email Infrastructure
            Geliştirici Araçları: Developer Tools

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Ana Sayfa: index.md
  - Program: program.md
  - Evrensel Kabul: universal-acceptance.md
  - Takvim: takvim.md
  - Katılım: katilim.md
  - Kriterler: kriterler.md
  - Doğrulama: dogrulama.md
  - Değerlendirme: degerlendirme.md
  - Örnek Projeler:
      - ornek-projeler/index.md
      - Web ve E-ticaret:
          - ornek-projeler/ua-eticaret.md
          - ornek-projeler/ua-randevu.md
      - Kamu ve Eğitim:
          - ornek-projeler/belediye-basvuru.md
          - ornek-projeler/kampus-kulup.md
          - ornek-projeler/okul-veli.md
      - Mobil:
          - ornek-projeler/mobil-kayit.md
          - ornek-projeler/mobil-webmail.md
      - E-posta Altyapısı:
          - ornek-projeler/webmail-eklenti.md
          - ornek-projeler/bulten-servisi.md
          - ornek-projeler/destek-bileti.md
      - Geliştirici Araçları:
          - ornek-projeler/dogrulama-kutuphanesi.md
          - ornek-projeler/ua-denetci.md
  - Kaynaklar: kaynaklar.md
  - SSS: sss.md
